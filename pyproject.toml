[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataopen"
version = "0.1.0"
description = "Universal core + game adapters for synthetic human-pose dataset collection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "lupa>=2", "ruff", "onnx", "onnxruntime>=1.17", "cryptography>=42"]
capture = ["mss>=9", "pillow>=10"]
secure = ["cryptography>=42"]                        # the control gateway: device identity, sealed settings files, encrypted data at rest
quality = ["onnxruntime>=1.17"]
train = ["torch>=2.2", "pillow>=10", "onnx", "onnxruntime>=1.17"]   # the detector: dataopen detector train|export|quantize

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataopen = ["game_profiles/*.toml", "schemas/*.toml", "detector/csrc/*", "assist/csrc/*", "bridge/csrc/*", "video/csrc/*"]

[project.scripts]
dataopen = "dataopen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["adapters"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "B905", "B008", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702"]
"src/dataopen/hw/*" = ["E501"]          # specification tables with prose in the data lines
"src/dataopen/provisioning/*" = ["E501"]  # the same: records, steps and scenarios carry prose
"src/dataopen/latency/*" = ["E501"]  # the same: stage tables carry prose in the data lines
"src/dataopen/updates/*" = ["E501"]  # the same: the reason table carries prose in the data lines
