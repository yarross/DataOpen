[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataopen"
version = "0.1.0"
description = "Universal core + game adapters for synthetic human-pose dataset collection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "lupa>=2", "ruff", "onnx", "onnxruntime>=1.17"]
capture = ["mss>=9", "pillow>=10"]
quality = ["onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataopen = ["game_profiles/*.toml", "schemas/*.toml"]

[project.scripts]
dataopen = "dataopen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["adapters"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "B905", "B008", "B027"]
