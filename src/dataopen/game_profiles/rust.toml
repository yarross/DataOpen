id = "rust"
name = "Rust (own local server, no EAC)"
engine = "unity-mono"
archetype = "B-csharp (BepInEx client plugin) + RCON server control"
mailbox_dir = "${RUST_DIR}/BepInEx/config/dataopen"

[render]
width = 1280
height = 720

[capture]
mode = "engine"

[mod_options]
population_mode = "spawn"
camera_mode = "player_relative"   # server controls spawning, the client camera follows the local player
settle_ticks = 5
set_resolution = true
hud = false

# Server control over RCON (WebSocket). Password comes from the environment, never from this file.
[server]
rcon = "127.0.0.1:28016"
password_env = "RUST_RCON_PASSWORD"
settle_s = 1.5
# Command templates sent before each scene. Placeholders: time_of_day (hours), rain, fog, cloud_cover (0..1)
# derived from the core's environment sample. Adjust the command names for your Rust version (VERIFY).
scene_begin = [
  "env.progresstime false",
  "env.time {time_of_day:.2f}",
  "weather.rain {rain:.2f}",
  "weather.fog {fog:.2f}",
  "weather.clouds {cloud_cover:.2f}",
]
scene_end = []

[session]
frames_per_scene = 30
negative_ratio = 0.1

# Closed-loop validation (docs/QUALITY.md). Off by default: enable it and point it at a model, or run the cheap gates only
# (broken skeleton / blank frame / imperceptible person) with evaluator = "none".
[quality]
enabled = false
evaluator = "onnx"                 # onnx | simulated (test double) | none
model = ""                         # path to a YOLOv8-pose or D-FINE ONNX model
format = "yolov8_pose"             # yolov8_pose | dfine
input_size = [640, 640]
device = "cpu"                     # cpu | cuda | tensorrt
keypoint_map = "coco17"            # 17-point COCO model -> our 13 points; "identity" for a model trained on our schema
max_inflight = 2                   # frames validated while the engine renders the next ones
sample_every = 1                   # run the model on every N-th frame (cheap gates always run)
min_person_px = 20                 # a visible person shorter than this rejects the frame (below 12 px: ignored)
audit_fraction = 0.02              # share of dropped frames kept in quality/audit/ to measure false rejections

[quality.policy]
phantom_action = "quarantine"     # observe mode: it may be a REAL person the mod did not report -> quarantine/ for audit
suspect_action = "quarantine"

[quality.balance]                  # dataset-level control of the adaptive randomizer (docs/QUALITY.md, section 5)
target_hard_share = 0.30           # desired share of keep_hard among usable frames
max_reject_share = 0.15            # above this, bins that keep producing rejected frames are suppressed
uniform_min = 0.10                 # share of draws that always sample the full prior (coverage guarantee)

[quality.feedback]                 # adaptive domain randomization (--adaptive)
warmup_frames = 150
exploit_p = 0.2

[provenance]
assets = "UNSPECIFIED: Rust game assets (Facepunch Studios); check the licence before distributing derived data"

[status]
verified = "not verified on a real installation"
notes = "Only against your own local server with EAC disabled. Heavy client; the game updates often, re-run doctor after every update."
